<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Inter:wght@400;500;600&display=swap">
<style>
:root { --bg:#0d0f12; --card:#171a1f; --text:#f4f5f7; --muted:#9aa1ab; --line:#2a2f37; --accent:#e0312b; --accent-text:#fff; color-scheme:dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 "Inter", system-ui, -apple-system, sans-serif; }
a { color:var(--accent); }
header.site { border-bottom:1px solid var(--line); background:var(--card); }
header.site nav { max-width:880px; margin:0 auto; padding:14px 16px; display:flex; gap:20px; align-items:center; }
header.site .brand { font-weight:700; font-size:18px; color:var(--text); text-decoration:none; margin-right:auto; }
main { max-width:880px; margin:0 auto; padding:32px 16px 64px; }
h1 { font-size:30px; margin:0 0 8px; } h2 { font-size:20px; margin:32px 0 12px; }
.muted { color:var(--muted); }
.grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
.card h3 { margin:0 0 4px; }
.price { font-weight:600; }
.btn { display:inline-block; background:var(--accent); color:var(--accent-text); border:0; border-radius:8px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
.slots { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
.slot { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; }
.slot.on { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
label { display:block; margin:12px 0 4px; font-weight:600; font-size:14px; }
input, textarea, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font:inherit; }
.error { color:#dc2626; } .ok { color:#16a34a; }
.badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; background:var(--line); }
.timeline { list-style:none; padding:0; border-left:2px solid var(--line); margin-left:6px; }
.timeline li { padding:0 0 16px 16px; position:relative; }
.timeline li::before { content:""; position:absolute; left:-7px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
h1, h2, header.site .brand, .btn, .price { font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-style:italic; text-transform:uppercase; }
h1 { font-weight:900; font-size:40px; } h2 { font-weight:800; border-bottom:3px solid var(--accent); padding-bottom:6px; }
.btn { font-weight:800; letter-spacing:.04em; font-size:17px; }
a { color:#ff8a84; } .btn { color:var(--accent-text); }
h1 em { color:var(--accent); }
.eyebrow { color:var(--muted); font-size:13px; letter-spacing:.3em; text-transform:uppercase; margin:0 0 6px; }
.cats { display:grid; gap:10px; margin-top:24px; }
.cat { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.cat[open] { border-color:var(--accent); }
.cat summary { list-style:none; display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; }
.cat summary::-webkit-details-marker { display:none; }
.cat .ctitle { font:italic 800 24px/1 "Barlow Condensed","Arial Narrow",sans-serif; text-transform:uppercase; letter-spacing:.03em; margin-right:auto; }
.cat .cmeta { color:var(--muted); font-size:13px; white-space:nowrap; }
.cat .chev { width:22px; height:22px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; background:var(--bg); font-size:12px; transition:transform .15s; }
.cat[open] .chev { transform:rotate(180deg); background:var(--accent); color:var(--accent-text); }
.menu { list-style:none; margin:0; padding:0 8px 8px; }
.svc { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:4px 16px; align-items:center; padding:12px 10px; border-top:1px solid var(--line); color:var(--text); text-decoration:none; border-radius:4px; }
.svc:hover { background:var(--bg); }
.svc .name { font-weight:600; } .svc .desc { color:var(--muted); font-size:14px; }
.svc .time { color:var(--muted); font-size:13px; white-space:nowrap; }
.svc .sprice { font:italic 800 22px/1 "Barlow Condensed","Arial Narrow",sans-serif; text-align:right; }
.svc .go { grid-column:3; font:italic 800 14px/1 "Barlow Condensed","Arial Narrow",sans-serif; text-transform:uppercase; color:#ff8a84; text-align:right; }
@media (max-width:560px) { .svc { grid-template-columns:minmax(0,1fr) auto; } .svc .time { grid-column:1; grid-row:2; } .svc .sprice { grid-column:2; grid-row:1; } .svc .go { grid-column:2; grid-row:2; } .cat .cmeta { display:none; } }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-top:12px; overflow-x:auto; }
.tabs a { padding:10px 14px; color:var(--muted); text-decoration:none; font-weight:600; border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.tabs a.on { color:var(--text); border-color:var(--accent); }
.chip { padding:6px 12px; border:1px solid var(--line); border-radius:999px; color:var(--text); text-decoration:none; font-size:14px; }
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-top:16px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:2px; }
.kpi span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
.kpi b { font:italic 800 30px/1.1 "Barlow Condensed","Arial Narrow",sans-serif; font-variant-numeric:tabular-nums; }
.kpi small { color:var(--muted); font-size:13px; }
.bars { display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:2px; height:200px; align-items:end; border-bottom:1px solid var(--line); padding-top:8px; }
.bar { height:100%; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:default; }
.bar .fill-wrap { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; }
.bar .fill { width:70%; max-width:36px; min-height:2px; background:var(--accent); border-radius:4px 4px 0 0; }
.bar:hover .fill { filter:brightness(1.2); }
.bar small { color:var(--muted); font-size:11px; white-space:nowrap; transform:translateY(100%); padding-top:2px; }
.bars { margin-bottom:24px; }
.hbar { display:flex; align-items:center; gap:8px; } .hbar div { height:10px; background:var(--accent); border-radius:0 4px 4px 0; min-width:2px; } .hbar span { font-variant-numeric:tabular-nums; }
td, th { font-variant-numeric:tabular-nums; }
.paybox { margin-top:10px; padding:10px 12px; border:1px dashed var(--line); border-radius:8px; font-size:14px; }

header.site nav, main { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.demo { background:#e0312b; color:#fff; font-size:13px; font-weight:500; }
.demo div { max-width:880px; margin:0 auto; padding-block:8px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--card); border:1px solid var(--accent); color:var(--text); padding:10px 16px; border-radius:8px; font-size:14px; z-index:20; max-width:calc(100% - 32px); }
.card { min-width:0; } .row > * { min-width:0; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>

const main = document.getElementById("main"), toast = document.getElementById("toast");
let t; function say(msg) { toast.textContent = msg; toast.hidden = false; clearTimeout(t); t = setTimeout(() => toast.hidden = true, 2600); }
function show(key) { main.innerHTML = PAGES[key] || PAGES.bookings; scrollTo(0, 0); }
function route(href) {
  if (!href) return null;
  if (href.startsWith("/admin/metrics")) { const m = href.match(/range=(\w+)/); return "metrics-" + (m ? m[1] : "30"); }
  if (href.startsWith("/admin/customers")) return "customers";
  if (href === "/admin" || href.startsWith("/admin?")) return "bookings";
  return null;
}
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) { e.preventDefault(); show(go.dataset.go); return; }
  const a = e.target.closest("a"); if (!a) return;
  const href = a.getAttribute("href") || "";
  if (href.startsWith("mailto:")) return;
  e.preventDefault();
  const key = route(href);
  if (key) return show(key);
  if (href.includes("customers.csv")) return say("On the live site this downloads a spreadsheet of all customers.");
  if (href.includes("/booking/")) return say("On the live site this opens the customer's booking status page.");
  say("Not available in the preview.");
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector("button"), label = btn ? btn.textContent.trim() : "";
  const card = f.closest(".card");
  if (label === "Log out") return say("Log out is turned off in the preview.");
  if (label === "Mark paid" && card) {
    const badge = card.querySelector(".badge"); if (badge) badge.textContent = "Paid";
    f.remove(); return say("Marked paid. The customer's page now shows Paid.");
  }
  if (label === "Post update" && card) {
    const sel = f.querySelector("select"), badges = card.querySelectorAll(".badge");
    if (sel && badges.length) badges[badges.length - 1].textContent = sel.options[sel.selectedIndex].text;
    const msg = f.querySelector("input[name=message]"); const note = msg && msg.value ? ' with your note' : '';
    if (msg) msg.value = "";
    return say("Update posted" + note + ". The customer sees it on their booking page.");
  }
  if (label === "Search") {
    const q = (f.querySelector("input[name=q]").value || "").toLowerCase();
    main.querySelectorAll("tbody tr").forEach(tr => tr.hidden = q && !tr.textContent.toLowerCase().includes(q));
    return;
  }
});
show("bookings");
